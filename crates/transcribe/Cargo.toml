[package]
name = "screenrecord-transcribe"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
screenrecord-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "query"] }
tokio = { version = "1", features = ["rt", "macros", "process", "fs", "io-util", "time", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
sha2 = "0.10.9"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
