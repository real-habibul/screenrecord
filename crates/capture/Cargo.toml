[package]
name = "screenrecord-capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
screenrecord-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-capture = "=2.0.1"
wasapi = "=0.27.0"
hound = "3.5"
log = "0.4"
sha2 = "0.10"
tempfile = "3"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Performance", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Com_Marshal", "Win32_System_Variant", "Win32_Media_Audio", "Win32_System_WinRT", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_Security"] }

[[example]]
name = "capture-smoke"
path = "examples/capture_smoke.rs"

[[example]]
name = "loopback-tone"
path = "examples/loopback_tone.rs"
