worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name screenrecord.88apps.dev;
        root /var/www/screenrecord/current;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz { access_log off; return 204; }
        location = /LICENSE { default_type text/plain; }
        location = /THIRD_PARTY_NOTICES.md { default_type text/plain; }
        location ~ \.sha256$ { default_type text/plain; }
        location / { try_files $uri $uri/ =404; }
    }
}
